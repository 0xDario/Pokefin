allowBuilds:
  '@sentry/cli': true
  sharp: true
  unrs-resolver: true

overrides:
  picomatch@4: ^4.0.4
  postcss: '>=8.5.18'
  sharp: '>=0.35.0'
  brace-expansion@1: ^1.1.12
  brace-expansion@2: ^2.0.2
  brace-expansion@5: ^5.0.9
  fast-uri: ^3.1.5
  # postcss pulls nanoid; <3.3.17 has a high-severity advisory. Pinned to the
  # patched 3.x line rather than left open-ended: nanoid 6 declares
  # engines node ^22 || ^24 || >=26, which would silently narrow the Node
  # range below what Next supports (>=20.9.0) for no security benefit.
  nanoid: '>=3.3.17 <4'
